# ==============================================================================
# Docker Compose for Production / Docker Hub Deployment (CD Pipeline)
# Pulls pre-built images generated by GitHub Actions CI
# ==============================================================================
services:
  backend:
    image: ${DOCKERHUB_USERNAME:-kieutrangg06}/email-automation-backend:latest
    container_name: email_backend_prod
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ${DOCKERHUB_USERNAME:-kieutrangg06}/email-automation-frontend:latest
    container_name: email_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
